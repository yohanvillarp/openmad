name: Integracion Continua (CI)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate:
    name: Compilacion, Linter y Pruebas (Turborepo)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependencias del monorepo
        run: npm install

      - name: Ejecutar Compilacion, Linter y Pruebas en Paralelo
        run: npx turbo run build lint test

      - name: Generar Reporte de Cobertura en Backend
        run: npm --prefix backend run test:cov

      - name: Subir Cobertura a Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: openmad-backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
