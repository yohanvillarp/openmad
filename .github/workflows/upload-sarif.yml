name: "Carga de Analisis SARIF"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '45 15 * * 4' # Ejecución semanal cada jueves

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  upload-sarif:
    name: Generar y Cargar Reporte SARIF
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar archivo SARIF
        run: npm run sarif:generate

      - name: Cargar reporte SARIF a GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: "openmad-static-analysis"
